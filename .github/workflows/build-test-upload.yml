name: Reusable Build, Container Test & Upload

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the file created in the compile/build process'
        required: false
        type: string
        default: 'conixer'
      upload_url:
        description: 'Target for the compilation outcome file to be uploaded to'
        required: true
        type: string
        default: 'https://neurodine.com/furuse-dead-end'
    secrets:
      UPLOAD_TOKEN:
        description: 'Optional autorization token of the USER'
        required: false

jobs:
  classy-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate tag format and commit
        run: |
          typeset TAG_NAME=""
          TAG_NAME="${GITHUB_REF_NAME:-}"
          if [[ ! "${TAG_NAME:?}" =~ ^concrMix-BFA-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf "ERROR: Tag '%s' does not match expected format: \"concrMix-BFA-vX.X.X\"" "${TAG_NAME}" >&2 || :;
            false;
          else
            typeset TAG_COMMIT=""
            TAG_COMMIT=$( git rev-list -n 1 "refs/tags/${TAG_NAME}" 2>/dev/null || :; )
            if [ "${TAG_COMMIT:?}" == "${GITHUB_SHA}" ]; then
            	:;
            fi
          fi
          exit

      - name: Check Makefile exists
        run: |
          if [ ! -f "Makefile" ]; then
            echo "ERROR: A file called:\"Makefile\" is required and must be in root of the repository." >&2 || :;
            false;
          fi
          exit

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile with Makefile
        run: |
          if make -j"$(nproc)" ; then
            typeset ARTIFACT=""
            ARTIFACT="${{ inputs.artifact_name }}"
            if [ -f "${ARTIFACT:?}" ]; then
              : chmod +x "${ARTIFACT}";
            else
              echo "ERROR: Compilation and/or Build artifact:'$ARTIFACT' was not found." >&2 || :;
              false
            fi
          fi
          exit

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: golddigger-nugget
          # Zmień ścieżkę na faktyczną nazwę/lokalizację pliku wyjściowego z Makefile
          path: ./build/nugget

  golddigging-effort:
    runs-on: ubuntu-latest
    needs: classy-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: golddigger-nugget
          path: ./bin

      - name: Build Digger Craft Environment for Testing if NOT malicious
        run: docker build -t digger-unformal-collision-container \
             -f unreal-BFA/Dockerfile \
             -param 
             .

      - name: Run systemd service and verify stdin/stdout
        run: |
          set -e

          # 1. Starting containser with systemd in the background
          docker run -d \
            --name digger-collision-unit \
            --privileged \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$(pwd)/bin/nugget:/usr/local/bin/my_program:ro" \
            digger-unformal-collision-container

          # Trap for removing container after the step is finished
          trap "docker rm -f systemd-unit-runner >/dev/null 2>&1 || true" EXIT
          # TODO: A trap solutions is EXTREMLY shitty idea - offcoruse a AI suggestion
          #       this must change as is histerically and historically stupid as hell !!

          # 2. Another tootaly wicekd ansd stupid approach for checking systemd avaiabiliy
          docker exec systemd-unit-runner systemctl is-system-running --wait || true
          # TODO:   Why to hell wait for it to start on OUTSIDE of the container?
          #         The rest of functionality should simply happen exactly at the 
          #         dawn of the container raising  - it's best known to be UP for INTERNAL serviocesss
          #         why AI is so freking stupid thinking in paths like this.. ???
          # TODO:   Do not waste time on dynamic unit creation and ALL the systemct daemon reload which is very freking 
          #         stupid and CPU prone - better to inclusde in the Dockerfile the exact unit file
          #         alread being ready on systemd start (AND not in /etc/systemd/systes path as
          #          it is yet another AI stupid sugestion)
          #         The docker image should comprise of all the includes and functinality ready to 
          #         witnes the incomming ELF executable and to use it's decoded BODY in being
          #         run fronm unit that reads the decoded BODY and NEVER drops it into a FILE (not needed!)
          #         This can be actually read from curl as base64, then DE-gziped and then piped into unix socket
          #         for a systemd's dynamic unit execution of sth being read from unix socket transposed from network socket.
          #         Next, this would be fed with only one (or more) ASSERT-lines from a CSV file already present, or piped.
          #         This could/should run inside a well writen SHEL program having nondefaul MAIN function - waiting, present inside Dockerfile, added during container build
          #         Why bindmount EXE as RO ?! Do they train AI on ideas that seem to have THE BIGGEST possibility
          #         of being hacked... I relally can not understand it.
          #         So mnyny AI stupid ideas in one propmpt response! \
          #         It is so ismple to see that build makes a ELF files and runs this files. A maliciouis code WILL
          #         for SURE happen to be uploaded by some brainiacs!
          #         Why AI suggests to expose this code into a well knows PATH location - a file with a user +x on it ?!?!?!?!
         
          
          # The below code has to go sirious NEVER-USE-IT-LIKE-THIS modifications towards
          # being implemented as a WHOLE in dockrefile, so the below code is a DUMP, to be trashed... translating anyway.
          #
          # 3. Creating systemd unit with redirection: stdin/stdout threwout named FIFO
          docker exec systemd-unit-runner bash -c '
            mkfifo /run/app.in /run/app.out
            cat <<EOF > /etc/systemd/system/my-program.service
          [Unit]
          Description=Test CLI Program

          [Service]
          Type=simple
          ExecStart=/bin/sh -c "exec /usr/local/bin/my_program < /run/app.in > /run/app.out"
          StandardOutput=journal
          StandardError=journal
          EOF
            systemctl daemon-reload
            systemctl start my-program.service
          '

          # 4. Call program logic on data "2, 2, 1, 1" on it's stdin with a paramed timeout on the program 
          OUTPUT=$(docker exec systemd-unit-runner bash -c '
            # Open descriptors in the background, for a write operation not to block read operation ?????
            exec 3>/run/app.in
            echo "2, 2, 1, 1" >&3
            exec 3>&-

            # Hard timeout on the read
            timeout 2s head -n 1 < /run/app.out
          ')

          echo "Program logic returns data:'$OUTPUT'" >&2 || :;

          # 5. Validating the OUTPUT data format:
          #     it should comprise from 4 numbers, in range from 3..10 (this is to be not strict boundry like here)
          if [[ ! "$OUTPUT" =~ ^([3-9]|10),\ ([3-9]|10),\ ([3-9]|10),\ ([3-9]|10)$ ]]; then
            echo "ERROR: Incorect format or value out of range." >&2 || :;
            docker exec systemd-unit-runner journalctl -u my-program.service --no-pager
            exit 1
          fi

          echo "SUCCESS: This program is a True GoldDigger - data are correct." >&2 || :;

      - name: Deploy solidified binary
        uses: actions/upload-artifact@v4
        with:
          name: listit-nugget
          path: ./build/nugget


  golddigger-listing:
    runs-on: ubuntu-latest
    needs: golddigging-effort
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: listit-nugget
          path: /listit

      - name: Install build dependencies
        run: |
          env sudo apt-get update && env sudo apt-get install -y --no-install-recommends \
          ca-certificates \
          curl

      - name: Upload artifact via curl
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          typeset SAFE_REPO="";
          SAFE_REPO="${GITHUB_REPOSITORY//\//_}";
          if [[ -n "${UPLOAD_TOKEN:-}" ]]; then 
            typeset UGLY_NUGET=""
            if [[ -n "${UGLY_NUGET:=$( env find ./listit/nugget -maxdepth 0 -size +0c )}" ]]; then
              # here a job to build a RPM from the file 
              # and then this should install as a RPM inside a USER namespace
              # making addiontal possible threats be exposed by SELINUX security
              # in addition to systemd execution inside it's own namespace slice
              unset -f 'beniceto_upload_target' 2>/dev/null || true;
              function 'beniceto_upload_target'() {
                set -- junkiesquestionwhyyoudoubtthearenotnice "$@"; shift
                env curl -s -o /dev/null -w "%{http_code}"\
                 -X PUT \
                 -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
                 --upload-file <( base64 < <( gzip <"${UGLY_NUGET}" ) ) \
                 "${UPLOAD_URL}/${SAFE_REPO}/${GITHUB_REF_NAME}/${ARTIFACT}"
              }; typeset -f -tx 'beniceto_upload_target';
              typeset RANCO_CONFIRM=""
              if [[ -n "${RANCO_CONFIRM:=$( beniceto_upload_target )}" ]]; then
                env printf 'INFO: Dealing with deploy. HTTP_RANCO=%s\n' "${RANCO_CONFIRM}" >&2 || :;
                if [[ ${RANCO_CONFIRM} =~ ^(2[[:digit:]]{2})$ ]]; then
                  exit
                fi
                exit (( (10#127 + (${RANCO_CONFIRM} % 10#"${ROUND_CLASS:-${RANCO_CONFIRM::1}00}")) ))
              fi
            fi
            echo "INFO: This suppose to happen - not planning any uploads." >&2 || :;
          else
            echo "ERROR: Invalid or missing authorization TOKEN" >&2 || :;
            false
          fi
