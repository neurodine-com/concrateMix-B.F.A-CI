name: Reusable Build, Container Test & Upload

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the file created in the compile/build process'
        required: false
        type: string
        default: 'conixer'
      upload_url:
        description: 'Target for the compilation outcome file to be uploaded to'
        required: true
        type: string
        default: 'https://neurodine.com/furuse-dead-end'
    secrets:
      UPLOAD_TOKEN:
        description: 'Optional autorization token of the USER'
        required: false

jobs:
  classy-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate tag format and commit
        run: |
          typeset TAG_NAME=""
          TAG_NAME="${GITHUB_REF_NAME:-}"
          if [[ ! "${TAG_NAME:?}" =~ ^concrMix-BFA-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf "ERROR: Tag '%s' does not match expected format: \"concrMix-BFA-vX.X.X\"" "${TAG_NAME}" >&2 || :;
            false;
          else
            typeset TAG_COMMIT=""
            TAG_COMMIT=$( git rev-list -n 1 "refs/tags/${TAG_NAME}" 2>/dev/null || :; )
            if [ "${TAG_COMMIT:?}" == "${GITHUB_SHA}" ]; then
            	:;
            fi
          fi
          exit

      - name: Check Makefile exists
        run: |
          if [ ! -f "Makefile" ]; then
            echo "ERROR: A file called:\"Makefile\" is required and must be in root of the repository." >&2 || :;
            false;
          fi
          exit

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile with Makefile
        run: |
          if make -j"$(nproc)" ; then
            typeset ARTIFACT=""
            ARTIFACT="${{ inputs.artifact_name }}"
            if [ -f "${ARTIFACT:?}" ]; then
              : chmod +x "${ARTIFACT}";
            else
              echo "ERROR: Compilation and/or Build artifact:'$ARTIFACT' was not found." >&2 || :;
              false
            fi
          fi
          exit

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: golddigger-nugget
          # Zmień ścieżkę na faktyczną nazwę/lokalizację pliku wyjściowego z Makefile
          path: ./build/nugget

  golddigging-effort:
    runs-on: ubuntu-latest
    needs: classy-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: golddigger-nugget
          path: ./bin

      - name: Build Digger Craft Environment for Testing if NOT malicious
        run: docker build -t digger-unformal-collision-container -f unreal-BFA/Dockerfile .

      - name: Run systemd service and verify stdin/stdout
        run: |
          set -e

          # 1. Start kontenera z systemd w tle
          docker run -d \
            --name digger-collision-unit \
            --privileged \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$(pwd)/bin/nugget:/usr/local/bin/my_program:ro" \
            digger-unformal-collision-container

          # Gwarancja usunięcia kontenera po zakończeniu kroku
          trap "docker rm -f systemd-unit-runner >/dev/null 2>&1 || true" EXIT

          # 2. Oczekiwanie na gotowość systemd
          docker exec systemd-unit-runner systemctl is-system-running --wait || true

          # 3. Utworzenie usługi systemd z przekierowaniem stdin/stdout przez potoki FIFO
          docker exec systemd-unit-runner bash -c '
            mkfifo /run/app.in /run/app.out
            cat <<EOF > /etc/systemd/system/my-program.service
          [Unit]
          Description=Test CLI Program

          [Service]
          Type=simple
          ExecStart=/bin/sh -c "exec /usr/local/bin/my_program < /run/app.in > /run/app.out"
          StandardOutput=journal
          StandardError=journal
          EOF
            systemctl daemon-reload
            systemctl start my-program.service
          '

          # 4. Wysłanie danych "2, 2, 1, 1" na stdin i odczyt ze stdout z limitem 2 sekund
          OUTPUT=$(docker exec systemd-unit-runner bash -c '
            # Otwarcie deskryptorów w tle, aby zapis nie zablokował odczytu
            exec 3>/run/app.in
            echo "2, 2, 1, 1" >&3
            exec 3>&-

            # Odczyt jednej linii z twardym timeoutem 2 sekund
            timeout 2s head -n 1 < /run/app.out
          ')

          echo "Otrzymany wynik ze stdout: '$OUTPUT'"

          # 5. Walidacja formatu (4 liczby z zakresu 3..10 rozdzielone przecinkiem i spacją)
          if [[ ! "$OUTPUT" =~ ^([3-9]|10),\ ([3-9]|10),\ ([3-9]|10),\ ([3-9]|10)$ ]]; then
            echo "BŁĄD: Nieprawidłowy format lub wartości poza zakresem 3-10! Otrzymano: '$OUTPUT'"
            docker exec systemd-unit-runner journalctl -u my-program.service --no-pager
            exit 1
          fi

          echo "SUKCES: Program zwrócił poprawne dane w czasie poniżej 2 sekund."

      - name: Deploy solidified binary
        uses: actions/upload-artifact@v4
        with:
          name: listit-nugget
          # Zmień ścieżkę na faktyczną nazwę/lokalizację pliku wyjściowego z Makefile
          path: ./build/nugget


  golddigger-listing:
    runs-on: ubuntu-latest
    needs: golddigging-effort
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: listit-nugget
          path: /listit

      - name: Install build dependencies
        run: |
          env sudo apt-get update && env sudo apt-get install -y --no-install-recommends \
          ca-certificates \
          curl

      - name: Upload artifact via curl
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          typeset SAFE_REPO="";
          SAFE_REPO="${GITHUB_REPOSITORY//\//_}";
          if [[ -n "${UPLOAD_TOKEN:-}" ]]; then 
            typeset UGLY_NUGET=""
            if [[ -n "${UGLY_NUGET:=$( env find ./listit/nugget -maxdepth 0 -size +0c )}" ]]; then
              # here a job to build a RPM from the file 
              # and then this should install as a RPM inside a USER namespace
              # making addiontal possible threats be exposed by SELINUX security
              # in addition to systemd execution inside it's own namespace slice
              unset -f 'beniceto_upload_target' 2>/dev/null || true;
              function 'beniceto_upload_target'() {
                set -- junkiesquestionwhyyoudoubtthearenotnice "$@"; shift
                env curl -s -o /dev/null -w "%{http_code}"\
                 -X PUT \
                 -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
                 --upload-file <( base64 < <( gzip <"${UGLY_NUGET}" ) ) \
                 "${UPLOAD_URL}/${SAFE_REPO}/${GITHUB_REF_NAME}/${ARTIFACT}"
              }; typeset -f -tx 'beniceto_upload_target';
              typeset RANCO_CONFIRM=""
              if [[ -n "${RANCO_CONFIRM:=$( beniceto_upload_target )}" ]]; then
                env printf 'INFO: Dealing with deploy. HTTP_RANCO=%s\n' "${RANCO_CONFIRM}" >&2 || :;
                if [[ ${RANCO_CONFIRM} =~ ^(2[[:digit:]]{2})$ ]]; then
                  exit
                fi
                exit (( (10#127 + (${RANCO_CONFIRM} % 10#"${ROUND_CLASS:-${RANCO_CONFIRM::1}00}")) ))
              fi
            fi
            echo "INFO: This suppose to happen - not planning any uploads." >&2 || :;
          else
            echo "ERROR: Invalid or missing authorization TOKEN" >&2 || :;
            false
          fi
